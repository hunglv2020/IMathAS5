approval_policy = "on-request"
sandbox_mode = "workspace-write"

[features]
hooks = true
multi_agent = true

[agents]
max_threads = 4
max_depth = 1

[mcp_servers.content-workbench]
url = "http://127.0.0.1:38765/mcp"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]
